<html>
<head>
    <meta charset="UTF-8">
    <title>Formulario</title>
</head>
<body>
<form action="/inscribir" method="post">
    <label for="nombreParticipante">Nombre del participante:</label>
    <input type="text" id="nombreParticipante" name="nombreParticipante" required><br>

    <label for="taller">Número del taller:</label>
    <input type="number" id="taller" name="taller" required><br>

    <button type="submit">Enviar</button>
</form>
</body>
</html>
