<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cafeteria</title>
</head>
<body>
<h2>Cafeteria</h2>

<form action="/cafe" method="POST">

  <label>Tipo cafe:</label><br>
  <input type="text" id="tipoCafe" name="tipoCafe" required><br><br>

  <label>Cantidad:</label><br>
  <input type="number" id="cantidad" name="cantidad" required><br><br>

  <button type="submit">Solicitar cafe</button>
</form>
</body>
</html>
